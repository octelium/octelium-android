name: Build Android artifacts

permissions: {}

env:
  NDK_VERSION: 30.0.16248370

on:
  workflow_dispatch:
    inputs:
      octelium_ref:
        description: The Octelium branch, tag or commit whose liboctelium is bundled
        required: false
        default: main

jobs:
  resolve-octelium:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: octelium/octelium
          ref: ${{ inputs.octelium_ref }}
          path: octelium-source
          persist-credentials: false
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git -C octelium-source rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-octelium
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: octelium/octelium
          ref: ${{ needs.resolve-octelium.outputs.commit }}
          path: octelium-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: octelium-source/go.work
          cache-dependency-path: octelium-source/client/liboctelium/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install the Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;4.1.2"
      - name: Build liboctelium from ${{ inputs.octelium_ref }}
        shell: bash
        env:
          OCTELIUM_SOURCE_DIR: ${{ github.workspace }}/octelium-source
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./scripts/build-liboctelium.sh
      - name: Build the host libraries
        env:
          OCTELIUM_SOURCE_DIR: ${{ github.workspace }}/octelium-source
        run: ./scripts/build-host-libs.sh
      - name: Test
        run: ./gradlew --no-configuration-cache :core:test :app:testDebugUnitTest
      - name: Build application
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify the 16 KB page size alignment
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./scripts/check-elf-alignment.sh app/build/outputs/apk/debug/app-debug.apk
          ./scripts/check-elf-alignment.sh app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
      - name: Collect artifacts
        env:
          OCTELIUM_COMMIT: ${{ needs.resolve-octelium.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          output="release-output"
          mkdir "$output"
          cp app/build/outputs/apk/debug/app-debug.apk "$output/octelium-android-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$output/octelium-android-release-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$output/octelium-android-release-unsigned.aab"
          printf '%s\n' "$OCTELIUM_COMMIT" > "$output/OCTELIUM_COMMIT"
          git rev-parse HEAD > "$output/OCTELIUM_ANDROID_COMMIT"
          cd "$output"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: octelium-android
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
